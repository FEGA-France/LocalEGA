
networks:
  fega-external:
    external: true
  internal:
  vault:

volumes:
  mq:
  inbox:
  staging:
  s3-inbox:
  lega-vault:
    external: true
  vault.bkp:
  lega-vault-db:
    external: true

services:
  inbox:
    hostname: lega-inbox
    container_name: lega-inbox
    networks:
      - fega-external # public access, eg from fega-inbox/uploader
      - internal
    ports:
      - 2222:22
    volumes:
      - inbox:/ega/inbox/home
      # - ../../src/inbox/conf/sshd_config:/etc/ega/sshd_config:ro
    image: lega/inbox:latest
    # environment:
    #   - WITH_SYSLOG=yes

  mq:
    environment:
      # - FEGA_CONNECTION=amqps://lega-node:lega-secret@france.ega-archive.org:5671/lega-node
      - FEGA_CONNECTION=amqp://demo:secret@fega-mq:5672/demo
    hostname: mq
    ports:
      - 15672:15672
      - 5672:5672
    image: lega/mq
    container_name: lega-mq
    networks:
      - fega-external # so it sees fega-mq
      - internal
    volumes:
      - mq:/var/lib/rabbitmq
      # - ../../src/mq/conf/definitions.tmpl.json:/etc/rabbitmq/definitions.tmpl.json:ro
    # entrypoint: ['/bin/sleep']
    # command: '365d'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  dispatcher:
    depends_on:
      mq:
        condition: service_healthy
        restart: true
    hostname: dispatcher
    image: lega/dispatcher:latest
    container_name: lega-dispatcher
    volumes:
      - ./confs/dispatcher.ini:/etc/ega/lega.ini:ro
      - ./confs/logger.json:/etc/ega/logger.json:ro
    networks:
      - internal
    command: [ "/etc/ega/lega.ini" ]


  ingester-1:
    depends_on:
      mq:
        condition: service_healthy
        restart: true
    image: lega/ingester:latest
    networks:
      - internal
    volumes:
      - ./confs/ingester.ini:/etc/ega/lega.ini:ro
      - ./confs/logger.json:/etc/ega/logger.json:ro
      - ./confs/service.seckey:/etc/ega/service.seckey:ro
      - ./confs/master.pubkey:/etc/ega/master.pubkey:ro
      - inbox:/ega/inbox/upload:ro
      - staging:/ega/staging
    hostname: ingester-1
    container_name: lega-ingester-1
    command: ["/etc/ega/lega.ini", "ingestion-1"]

  ingester-2:
    extends:
      service: ingester-1
    hostname: ingester-2
    container_name: lega-ingester-2
    command: ["/etc/ega/lega.ini", "ingestion-2"]
  ingester-3:
    extends:
      service: ingester-1
    hostname: ingester-3
    container_name: lega-ingester-3
    command: ["/etc/ega/lega.ini", "ingestion-3"]
  ingester-4:
    extends:
      service: ingester-1
    hostname: ingester-4
    container_name: lega-ingester-4
    command: ["/etc/ega/lega.ini", "ingestion-4"]


  archiver-1:
    depends_on:
      mq:
        condition: service_healthy
        restart: true
    image: lega/archiver:latest
    networks:
      - vault
      - internal # to make it contact mq without routing
    volumes:
      - ./confs/archiver.ini:/etc/ega/lega.ini:ro
      - ./confs/logger.json:/etc/ega/logger.json:ro
      - staging:/ega/staging
      - vault.bkp:/ega/backup
      - lega-vault:/ega/vault
    hostname: archiver-1
    container_name: lega-archiver-1
    command: ["/etc/ega/lega.ini", "archiver-1"]

  archiver-2:
    extends:
      service: archiver-1
    hostname: archiver-2
    container_name: lega-archiver-2
    command: ["/etc/ega/lega.ini", "archiver-2"]
  archiver-3:
    extends:
      service: archiver-1
    hostname: archiver-3
    container_name: lega-archiver-3
    command: ["/etc/ega/lega.ini", "archiver-3"]
  archiver-4:
    extends:
      service: archiver-1
    hostname: archiver-4
    container_name: lega-archiver-4
    command: ["/etc/ega/lega.ini", "archiver-4"]


  vault-db:
    depends_on:
      mq:
        condition: service_healthy
        restart: true
    hostname: vault
    image: lega/vault-db:latest
    container_name: lega-vault-db
    volumes:
      - lega-vault-db:/ega/data
      - ./confs/pg.conf:/etc/ega/pg.conf:ro
      - ./confs/pg_hba.conf:/etc/ega/pg_hba.conf:ro
    networks:
      - vault
      - internal # to make it contact mq without routing
    user: postgres
    ports:
      - 5432:5432
    entrypoint: ["postgres"]
    command: ["-c", "config_file=/etc/ega/pg.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ega"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s


  s3:
    depends_on:
      mq:
        condition: service_healthy
        restart: true
    image: lega/s3:latest
    container_name: lega-inbox-s3
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      # RUSTFS_ROOT_USER: admin
      # RUSTFS_ROOT_PASSWORD: super-secret

      RUSTFS_ACCESS_KEY: "lega"
      RUSTFS_SECRET_KEY: "zzEH5pUK0gkrec1g9axPgZsKLGVXutVrarCoKm7t"

      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_OBS_LOGGER_LEVEL: "error"

      # Notifications
      RUSTFS_NOTIFY_ENABLE: true
      RUSTFS_NOTIFY_AMQP_ENABLE_PRIMARY: true
      RUSTFS_NOTIFY_AMQP_URL_PRIMARY: "amqp://admin:secret@mq:5672/%2F"
      RUSTFS_NOTIFY_AMQP_EXCHANGE_PRIMARY: "s3"
      RUSTFS_NOTIFY_AMQP_ROUTING_KEY_PRIMARY: "files.s3.upload"
      RUSTFS_NOTIFY_AMQP_QUEUE_DIR_PRIMARY: "/data/.notify/amqp"
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: "amqp://mq:5672"

    volumes:
      - s3-inbox:/data
    networks:
      - fega-external # so it sees fega-mq
      - internal
    healthcheck:
      test: ["CMD", "rc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
