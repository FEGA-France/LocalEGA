
networks:
  fega-external:
    external: true
  internal:
  vault:

volumes:
  mq:
  staging:
  # s3-data:
  #   external: true
  lega-vault:
    external: true
  vault.bkp:
  lega-vault-db:
    external: true

services:
  mq:
    environment:
      # - FEGA_CONNECTION=amqps://lega-node:lega-secret@france.ega-archive.org:5671/lega-node
      - FEGA_CONNECTION=amqp://demo:secret@fega-mq:5672/demo
    hostname: mq
    ports:
      - 15672:15672
      - 5672:5672
    image: lega/mq
    container_name: lega-mq
    networks:
      - fega-external # so it sees fega-mq
      - internal
    volumes:
      - mq:/var/lib/rabbitmq
      # - ../../src/mq/conf/definitions.tmpl.json:/etc/rabbitmq/definitions.tmpl.json:ro
    # entrypoint: ['/bin/sleep']
    # command: '365d'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  dispatcher:
    depends_on:
      mq:
        condition: service_healthy
        restart: true
    hostname: dispatcher
    image: lega/dispatcher:latest
    container_name: lega-dispatcher
    volumes:
      - ./confs/dispatcher.ini:/etc/ega/lega.ini:ro
      - ./confs/logger.json:/etc/ega/logger.json:ro
      - ../../src/ingestion/dispatcher/dispatcher:/var/src/dispatcher:ro
    networks:
      - internal
    command: [ "/etc/ega/lega.ini" ]

  ingester-1:
    depends_on:
      mq:
        condition: service_healthy
        restart: true
    image: lega/ingester:latest
    networks:
      - internal
      - fega-external # connect to fega-inbox
    volumes:
      - ./confs/ingester.ini:/etc/ega/lega.ini:ro
      - ./confs/logger.json:/etc/ega/logger.json:ro
      - ./confs/service.seckey:/etc/ega/service.seckey:ro
      - ./confs/master.pubkey:/etc/ega/master.pubkey:ro
      - staging:/ega/staging
      # - ../../src/ingestion/ingester/ingester:/var/src/ingester:ro
    hostname: ingester-1
    container_name: lega-ingester-1
    command: ["/etc/ega/lega.ini", "ingestion-1"]
    # entrypoint: "/bin/sleep"
    # command: "365d"
    # working_dir: "/var/src"

  ingester-2:
    extends:
      service: ingester-1
    hostname: ingester-2
    container_name: lega-ingester-2
    command: ["/etc/ega/lega.ini", "ingestion-2"]
  ingester-3:
    extends:
      service: ingester-1
    hostname: ingester-3
    container_name: lega-ingester-3
    command: ["/etc/ega/lega.ini", "ingestion-3"]
  ingester-4:
    extends:
      service: ingester-1
    hostname: ingester-4
    container_name: lega-ingester-4
    command: ["/etc/ega/lega.ini", "ingestion-4"]


  archiver-1:
    depends_on:
      mq:
        condition: service_healthy
        restart: true
    image: lega/archiver:latest
    networks:
      - vault
      - internal # to make it contact mq without routing
    volumes:
      - ./confs/archiver.ini:/etc/ega/lega.ini:ro
      - ./confs/logger.json:/etc/ega/logger.json:ro
      - staging:/ega/staging
      - vault.bkp:/ega/backup
      - lega-vault:/ega/vault
      # - ../../src/ingestion/archiver/archiver:/var/src/archiver:ro
    hostname: archiver-1
    container_name: lega-archiver-1
    command: ["/etc/ega/lega.ini", "archive-1"]
    # entrypoint: "/bin/sleep"
    # command: "365d"
    # working_dir: "/var/src"

  archiver-2:
    extends:
      service: archiver-1
    hostname: archiver-2
    container_name: lega-archiver-2
    command: ["/etc/ega/lega.ini", "archive-2"]
  archiver-3:
    extends:
      service: archiver-1
    hostname: archiver-3
    container_name: lega-archiver-3
    command: ["/etc/ega/lega.ini", "archive-3"]
  archiver-4:
    extends:
      service: archiver-1
    hostname: archiver-4
    container_name: lega-archiver-4
    command: ["/etc/ega/lega.ini", "archive-4"]

  vault-db:
    depends_on:
      mq:
        condition: service_healthy
        restart: true
    hostname: vault
    image: lega/vault-db:latest
    container_name: lega-vault-db
    volumes:
      - lega-vault-db:/ega/data
      - ./confs/pg.conf:/etc/ega/pg.conf:ro
      - ./confs/pg_hba.conf:/etc/ega/pg_hba.conf:ro
    networks:
      - vault
      - internal # to make it contact mq without routing
    user: postgres
    ports:
      - 5432:5432
    entrypoint: ["postgres"]
    command: ["-c", "config_file=/etc/ega/pg.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ega"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
