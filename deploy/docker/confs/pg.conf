hba_file = '/etc/ega/pg_hba.conf'

#listen_addresses = 'localhost' # comma-separated list of addresses;
			       # defaults to 'localhost'; use '*' for all
listen_addresses = '*' # all good: we are inside the container!

port = 5432
max_connections = 103
superuser_reserved_connections = 3

password_encryption = scram-sha-256

# - SSL -
#ssl = off
#ssl_ca_file = ''
#ssl_cert_file = 'server.crt'
#ssl_crl_file = ''
#ssl_key_file = 'server.key'
#ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL' # allowed SSL ciphers
#ssl_prefer_server_ciphers = on
#ssl_ecdh_curve = 'prime256v1'
#ssl_min_protocol_version = 'TLSv1.2'
#ssl_max_protocol_version = ''
#ssl_dh_params_file = ''
#ssl_passphrase_command = ''
#ssl_passphrase_command_supports_reload = off


shared_buffers = 128MB
dynamic_shared_memory_type = posix

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG
#------------------------------------------------------------------------------
wal_level = logical
max_wal_size = 1GB
min_wal_size = 80MB

# - What to Log -

log_connections = on
log_timezone = 'Etc/UTC'

log_min_duration_statement='5000' # in milliseconds

log_min_messages = debug1

logging_collector = on
log_directory = 'logs' # that means DATADIR/logs
log_filename = '%Y-%m-%d.log' # default was postgresql-%Y-%m-%d_%H%M%S.log
log_file_mode = 0640 # to let the lega group read them
log_line_prefix = '[%n][%m][%p][%l][%u][%d]<%r> ' # parsed by vector.dev

#------------------------------------------------------------------------------
# PROCESS TITLE
#------------------------------------------------------------------------------

cluster_name = 'pg-lega-vault'
update_process_title = on

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

datestyle = 'iso, mdy'
timezone = 'Etc/UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

#------------------------------------------------------------------------------
# Shared libraries
#------------------------------------------------------------------------------
shared_preload_libraries='pg_crypt4gh,pg_amqp'

crypt4gh.master_seckey = '5f85335d064475d3bb4c1e510de5b9c57b2feefd3360c8177ced7dca2fa26469'
#
# Update crypt4gh.master_seckey with the following python code snippet:
# python -c 'import crypt4gh.keys; print(crypt4gh.keys.get_private_key("/path/to/master.key.sec", lambda: "passphrase").hex())'
#

#------------------------------------------------------------------------------
# AMQP settings
#------------------------------------------------------------------------------
amqp.database = 'ega'
