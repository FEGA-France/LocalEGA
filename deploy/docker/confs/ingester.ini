[DEFAULT]
#logger = /etc/ega/logger.json

master_pubkey = c4gh_master_pubkey
service_key = c4gh_service_seckey

# 8 MB
#bufsize = 8388608
# 64 MB
bufsize = 67108864

skip_reencryption = false

source = inbox.http
destination = staging.posix

[inbox.http]
type = http

url = http://fega-inbox:8000
# we'll append <username>/<filepath>
login = demo
password = hello

[staging.posix]
type = posix
rootdir = /ega/staging

[broker]
connection = amqp://admin:secret@lega-mq:5672/%2F

exchange = lega
qos=1

[c4gh_master_pubkey]
loader_class = C4GHFilePubKey
filepath = /etc/ega/master.pubkey

[c4gh_service_seckey]
loader_class = C4GHFileKey
passphrase = hello
filepath = /etc/ega/service.seckey
